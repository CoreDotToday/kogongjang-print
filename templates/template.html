<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4;
            margin: 0;
        }
        @font-face {
            font-family: 'CustomFont';
            src: url('{{ font_path }}') format('truetype');
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'CustomFont', sans-serif;
            position: relative;
            width: 210mm;
            height: 297mm;
        }
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 210mm;
            height: 297mm;
            background-image: url('{{ image_path }}');
            background-size: cover;
            z-index: -1;
        }
        #name-field {
            position: absolute;
            top: 110mm;
            left: 80mm;
            font-size: 24pt;
            color: #000;
        }
        #close-kiosk-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: rgba(244, 67, 54, 0.85);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            font-size: 14px;
            cursor: pointer;
        }
        #close-kiosk-btn:hover {
            background: rgba(244, 67, 54, 1);
        }
        @media print {
            #close-kiosk-btn { display: none; }
        }
    </style>
</head>
<body>
    <button id="close-kiosk-btn" onclick="closeKiosk()">종료</button>
    <div id="background"></div>
    <div id="name-field">
        {{ name }}
    </div>
    <script>
    function closeKiosk() {
        fetch('/close-kiosk', { method: 'POST' })
            .then(function() { window.close(); })
            .catch(function() {});
    }
    </script>
</body>
</html>
